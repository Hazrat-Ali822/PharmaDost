<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Sehatyar">
  <defs>
    <linearGradient id="shy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0891b2"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#shy)"/>
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- symmetric heart outline -->
    <path d="M256 182
             C224 142 160 142 144 194
             C128 246 176 302 256 358
             C336 302 384 246 368 194
             C352 142 288 142 256 182 Z" stroke-width="26"/>
    <!-- ECG / heartbeat line through the heart, exiting to the right -->
    <path d="M150 262 H208 L228 216 L254 326 L280 206 L302 276 L324 262 H398" stroke-width="22"/>
  </g>
</svg>
