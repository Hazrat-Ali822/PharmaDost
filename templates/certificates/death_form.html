{% extends 'partials/base.html' %}
{% block title %}Death Certificate{% endblock %}
{% block page_title %}New Death Certificate{% endblock %}
{% block content %}
<div class="page-head">
  <div><h2>New Death Certificate</h2></div>
  <a class="btn alt" href="{% url 'certificate_list' %}">Back</a>
</div>
<div class="card" style="max-width:760px;">
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="btn-row" style="margin-top:8px;">
      <button class="btn" type="submit">Issue Certificate</button>
      <a class="btn alt" href="{% url 'certificate_list' %}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
