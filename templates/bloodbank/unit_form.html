{% extends 'partials/base.html' %}
{% block title %}Add Blood Unit{% endblock %}
{% block page_title %}Add Blood Unit{% endblock %}
{% block content %}
<div class="page-head">
  <div><h2>Add Blood Unit</h2></div>
  <a class="btn alt" href="{% url 'bloodbank_units' %}">Back</a>
</div>
<div class="card" style="max-width:640px;">
  <form method="post">
    {% csrf_token %}
    {% include 'partials/_form.html' with form=form %}
    <div class="btn-row" style="margin-top:8px;">
      <button class="btn" type="submit">Add to Stock</button>
      <a class="btn alt" href="{% url 'bloodbank_units' %}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
