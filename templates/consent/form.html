{% extends 'partials/base.html' %}
{% block title %}New Consent{% endblock %}
{% block page_title %}New Consent Form{% endblock %}
{% block content %}
<div class="page-head">
  <div><h2>New Consent Form</h2></div>
  <a class="btn alt" href="{% url 'consent_list' %}">Back</a>
</div>
<div class="card" style="max-width:780px;">
  <form method="post" data-offline-kind="consent">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="btn-row" style="margin-top:8px;">
      <button class="btn" type="submit">Save &amp; Print</button>
      <a class="btn alt" href="{% url 'consent_list' %}">Cancel</a>
    </div>
  </form>
</div>

{{ tpl_json|json_script:"tpl-data" }}
<script>
  (function () {
    var data = JSON.parse(document.getElementById('tpl-data').textContent || '{}');
    var sel = document.getElementById('id_template');
    if (!sel) return;
    sel.addEventListener('change', function () {
      var t = data[this.value];
      if (!t) return;
      var title = document.getElementById('id_title');
      var body = document.getElementById('id_body');
      var type = document.getElementById('id_consent_type');
      if (title && !title.value) title.value = t.title;
      if (body && !body.value.trim()) body.value = t.body;
      if (type) type.value = t.consent_type;
    });
  })();
</script>
{% endblock %}
