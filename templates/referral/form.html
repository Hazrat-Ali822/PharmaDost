{% extends 'partials/base.html' %}
{% block title %}New Referral{% endblock %}
{% block page_title %}New Referral{% endblock %}
{% block content %}
<div class="page-head">
  <div><h2>New Referral</h2></div>
  <a class="btn alt" href="{% url 'referral_list' %}">Back</a>
</div>
<div class="card" style="max-width:820px;">
  <form method="post" data-offline-kind="referral">
    {% csrf_token %}
    {% include 'partials/_form.html' with form=form %}
    <div class="btn-row" style="margin-top:8px;">
      <button class="btn" type="submit">Save Referral</button>
      <a class="btn alt" href="{% url 'referral_list' %}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
